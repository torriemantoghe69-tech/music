name: Build Windows Portable ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, windows-desktop]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build portable app folder
        run: npm run dist:win -- --publish never
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist/win-unpacked/*" -DestinationPath "dist/Shengyu-Music-Portable.zip" -Force
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Shengyu-Music-Portable-ZIP
          path: dist/Shengyu-Music-Portable.zip
          if-no-files-found: error
          retention-days: 30
