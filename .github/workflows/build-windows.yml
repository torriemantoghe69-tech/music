name: Build Windows Portable ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, windows-desktop]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build portable app folder
        run: npm run dist:win -- --publish never
      - name: Remove unused Chromium locales
        shell: pwsh
        run: |
          $localeDir = "dist/win-unpacked/locales"
          if (Test-Path $localeDir) {
            Get-ChildItem $localeDir -File -Exclude "zh-CN.pak","en-US.pak","ja.pak" | Remove-Item -Force
          }
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist/win-unpacked/*" -DestinationPath "dist/Shengyu-Music-Portable.zip" -CompressionLevel Optimal -Force
      - name: Publish direct ZIP download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portable-latest
          name: 声屿音乐播放器（最新版便携包）
          body: Windows 便携版。下载 Shengyu-Music-Portable.zip，解压后运行 声屿音乐播放器.exe。
          files: dist/Shengyu-Music-Portable.zip
          overwrite_files: true
          prerelease: true
          make_latest: false
