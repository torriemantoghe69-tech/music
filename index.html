<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101018"><title>声屿 · 音乐播放器</title>
<style>
:root{color-scheme:dark;--bg:#0e0e15;--panel:#171720;--panel2:#20202b;--muted:#9292a5;--text:#f5f4fb;--accent:#b49aff;--line:#30303c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 72% -15%,#342653 0,transparent 42%),var(--bg);color:var(--text);font:14px/1.5 Inter,"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh}
button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh;padding-bottom:105px}
aside{padding:28px 18px;border-right:1px solid #ffffff0d;background:#10101799}.brand{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:800;letter-spacing:1px;margin:2px 8px 38px}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#c2a5ff,#7655d9);display:grid;place-items:center;color:#171222;font-size:20px}
.nav-label{font-size:11px;color:#77778a;letter-spacing:1.5px;margin:25px 10px 10px}.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#aaa9ba;margin:3px 0;text-align:left;width:100%;background:transparent}.nav.active,.nav:hover{background:#292535;color:white}.nav b{font-size:17px;width:20px;text-align:center}.side-note{margin:34px 8px;padding:14px;border:1px solid var(--line);border-radius:13px;color:var(--muted);font-size:12px}
main{padding:30px clamp(20px,4vw,58px);min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}.greeting{color:var(--muted);font-size:13px}.top h1{font-size:27px;margin:3px 0 0}.actions{display:flex;gap:10px;align-items:center}.search{background:#ffffff0b;border:1px solid var(--line);border-radius:11px;padding:10px 14px;color:white;width:min(260px,30vw);outline:none}.btn{background:var(--panel2);padding:10px 15px;border-radius:10px;font-weight:650}.btn.primary{background:var(--accent);color:#1a1428}.btn:hover{filter:brightness(1.12)}
.hero{border-radius:22px;background:linear-gradient(110deg,#302448,#242137 56%,#1b1b28);padding:28px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:190px;overflow:hidden;position:relative}.hero:after{content:"♫";position:absolute;right:8%;top:-65px;font-size:280px;line-height:1;color:#ffffff09;transform:rotate(12deg)}.hero small{color:#d0bfff;letter-spacing:2px}.hero h2{font-size:29px;margin:8px 0}.hero p{color:#c1b9d0;margin:0 0 18px}.hero-art{width:130px;height:130px;flex:none;border-radius:25px;background:linear-gradient(145deg,#e1c6ff,#8064c8 55%,#382b60);display:grid;place-items:center;font-size:56px;box-shadow:0 18px 45px #08061088;transform:rotate(5deg);z-index:1}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:30px 0 14px}.section-head h3{font-size:18px;margin:0}.muted{color:var(--muted)}.drop{border:1px dashed #555064;border-radius:14px;padding:19px;text-align:center;color:var(--muted);margin:18px 0;background:#ffffff04}.drop.over{border-color:var(--accent);background:#b49aff12}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.chip{padding:7px 12px;background:transparent;color:var(--muted);border-radius:20px}.chip.active,.chip:hover{background:#302a3e;color:#e9ddff}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:#77778b;font-size:11px;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}.table td{padding:10px 12px;border-bottom:1px solid #ffffff0a}.track{cursor:pointer}.track:hover,.track.playing{background:#ffffff0a}.track.playing .song-name{color:var(--accent)}.song-cell{display:flex;align-items:center;gap:12px;min-width:190px}.cover{width:42px;height:42px;border-radius:9px;background:linear-gradient(140deg,#51416e,#252238);display:grid;place-items:center;font-size:18px;flex:none}.song-name{font-weight:650}.sub{font-size:12px;color:var(--muted)}.icon-btn{background:transparent;color:#9998aa;padding:7px;border-radius:8px}.icon-btn:hover{background:#ffffff12;color:white}.empty{padding:35px 12px;text-align:center;color:var(--muted)}.detail-panel{display:none;position:fixed;inset:0;background:#08080ddd;z-index:20;place-items:center;padding:20px}.detail-panel.open{display:grid}.detail-card{width:min(680px,95vw);max-height:85vh;overflow:auto;background:#1b1a25;border:1px solid var(--line);border-radius:18px;padding:22px}.detail-head{display:flex;justify-content:space-between;align-items:center}.detail-cover{width:180px;height:180px;object-fit:cover;border-radius:14px;background:#302a3e}.lyrics{white-space:pre-wrap;line-height:1.9;max-height:45vh;overflow:auto;color:#ded6ef}.file-size{font-size:12px;color:var(--muted);white-space:nowrap}
.player{position:fixed;bottom:0;left:0;right:0;height:94px;background:#171720f2;backdrop-filter:blur(20px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1.3fr 1fr;align-items:center;padding:12px 25px;gap:18px;z-index:5}.now{display:flex;align-items:center;gap:12px;min-width:0}.now .cover{width:52px;height:52px}.now-info{min-width:0}.now-info .song-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{display:flex;align-items:center;justify-content:center;gap:18px}.play{width:42px;height:42px;border-radius:50%;background:#f1eaff;color:#241b35;font-size:17px}.progress-wrap{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px}.progress-wrap input{width:100%;accent-color:var(--accent)}input[type=range]{cursor:pointer}.right-controls{display:flex;justify-content:flex-end;align-items:center;gap:13px}.right-controls input{width:90px;accent-color:var(--accent)}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{display:none}main{padding:20px 15px}.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.search{width:100%;flex:1}.hero{padding:22px;min-height:170px}.hero-art{width:90px;height:90px;font-size:40px}.hero h2{font-size:23px}.player{grid-template-columns:1fr auto;height:88px;padding:10px 12px}.controls{gap:10px}.progress-wrap,.right-controls .volume,.right-controls .extra{display:none}.right-controls{display:none}.now .cover{width:44px;height:44px}.table th:nth-child(3),.table td:nth-child(3),.table th:nth-child(4),.table td:nth-child(4){display:none}}
</style>
</head>
<body>
<div class="app">
<aside><div class="brand"><div class="logo">♫</div>声屿 MUSIC</div>
<div class="nav-label">音乐空间</div>
<button class="nav active" data-view="all"><b>▤</b> 全部歌曲</button>
<button class="nav" data-view="favorites"><b>♡</b> 我的收藏</button>
<button class="nav" data-view="recent"><b>◷</b> 最近播放</button>
<div class="nav-label">你的音乐</div><button class="nav" id="addSide"><b>＋</b> 导入音乐</button>
<div class="side-note">♪ 把喜欢的音乐放进自己的音乐空间。音乐文件只在你的设备本地读取。</div></aside>
<main>
<div class="top"><div><div class="greeting">YOUR PERSONAL MUSIC SPACE</div><h1 id="pageTitle">全部歌曲</h1></div><div class="actions"><input class="search" id="search" placeholder="⌕  搜索歌曲 / 艺术家"><button class="btn" id="folderBtn">导入文件夹</button><button class="btn primary" id="fileBtn">＋ 添加音乐</button></div></div>
<section class="hero"><div><small>LISTEN TO YOUR WORLD</small><h2>让每一首歌，都有自己的位置。</h2><p>整理音乐 · 收藏旋律 · 随时播放</p><button class="btn primary" id="heroPlay">▶ 播放全部</button></div><div class="hero-art">♫</div></section>
<div class="drop" id="drop">将音乐文件拖到这里即可添加，支持多选和文件夹导入</div>
<div class="section-head"><h3>音乐库 <span class="muted" id="count">(0)</span></h3><div class="toolbar"><button class="chip active" data-sort="name">名称排序</button><button class="chip" data-sort="artist">艺术家</button><button class="chip" data-sort="date">最近添加</button><button class="btn" id="dedupeBtn">检查重复歌曲</button></div></div>
<table class="table"><thead><tr><th style="width:48%">歌曲</th><th>专辑 / 文件类型</th><th>文件大小</th><th>时长</th><th>收藏</th><th></th></tr></thead><tbody id="tracks"></tbody></table>
<div class="empty" id="empty">还没有音乐，点击「添加音乐」或拖入本地音频文件。</div>
</main></div>
<div class="detail-panel" id="detailPanel"><div class="detail-card"><div class="detail-head"><b id="detailTitle">歌曲详情</b><button class="btn" id="closeDetail">关闭</button></div><img id="detailCover" class="detail-cover" alt="封面"><h3 id="detailArtist"></h3><h3>歌词</h3><pre id="lyricsText" class="lyrics">这首歌曲没有内嵌歌词。</pre></div></div><div class="player"><div class="now"><div class="cover" id="nowCover">♫</div><div class="now-info"><div class="song-name" id="nowTitle">尚未播放</div><div class="sub" id="nowArtist">选择一首歌曲开始聆听</div></div><button class="icon-btn" id="nowFav">♡</button></div>
<div><div class="controls"><button class="icon-btn" id="shuffle" title="随机播放">⤨</button><button class="icon-btn" id="prev">◀|</button><button class="play" id="play">▶</button><button class="icon-btn" id="next">|▶</button><button class="icon-btn" id="repeat" title="循环播放">↻</button></div><div class="progress-wrap"><span id="elapsed">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="duration">0:00</span></div></div>
<div class="right-controls"><button class="icon-btn extra" id="mute">◖))</button><input class="volume" id="volume" type="range" min="0" max="1" step=".01" value=".8"></div></div>
<input id="files" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus,.wma,.aiff,.aif,.ape,.alac,.mp4,.webm" multiple hidden>
<input id="folders" type="file" webkitdirectory multiple hidden>
<audio id="audio" preload="metadata"></audio>
<script>
(()=>{
const $=id=>document.getElementById(id), audio=$('audio');let songs=[],queue=[],current=-1,view='all',sort='name',shuffle=false,repeat=false,objectUrl=null;
const fmtSize=n=>n>=1048576?(n/1048576).toFixed(2)+' MB':(n/1024).toFixed(1)+' KB';
const fmt=n=>{if(!Number.isFinite(n))return'--:--';return Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0')};
const titleOf=f=>f.name.replace(/\.[^.]+$/,'');
const ext=f=>f.name.split('.').pop().toUpperCase();
function addFiles(list){let added=0;for(const f of list){if(!f.type.startsWith('audio/')&&!/\.(mp3|m4a|aac|wav|flac|ogg|opus|wma|aiff|aif|ape|alac)$/i.test(f.name))continue;if(songs.some(s=>s.file.name===f.name&&s.file.size===f.size&&s.file.lastModified===f.lastModified))continue;songs.push({id:crypto.randomUUID?.()||String(Math.random()),file:f,title:titleOf(f),artist:'未知艺术家',album:'本地音乐',duration:NaN,fav:false,added:Date.now(),lyrics:'',coverUrl:''});readTags(songs[songs.length-1]);added++}render();if(added&&!queue.length)queue=songs.map(s=>s.id)}
function visible(){let a=songs.filter(s=>view==='favorites'?s.fav:view==='recent'?s.played:true);let q=$('search').value.trim().toLowerCase();if(q)a=a.filter(s=>(s.title+s.artist+s.album+s.file.name).toLowerCase().includes(q));return a.sort(sort==='artist'?(a,b)=>a.artist.localeCompare(b.artist):sort==='date'?(a,b)=>b.added-a.added:(a,b)=>a.title.localeCompare(b.title,'zh-CN'))}
function render(){let a=visible();$('count').textContent='('+a.length+')';$('empty').style.display=a.length?'none':'block';$('tracks').innerHTML=a.map((s)=>{let idx=songs.indexOf(s);return '<tr class="track '+(idx===current?'playing':'')+'" data-id="'+s.id+'"><td><div class="song-cell"><div class="cover">♫</div><div><div class="song-name">'+esc(s.title)+'</div><div class="sub">'+esc(s.artist)+'</div></div></div></td><td><div>'+esc(s.album)+'</div><div class="sub">'+esc(ext(s.file))+'</div></td><td class="file-size">'+fmtSize(s.file.size)+'</td><td class="sub">'+fmt(s.duration)+'</td><td><button class="icon-btn fav" data-fav="'+s.id+'">'+(s.fav?'♥':'♡')+'</button></td><td><button class="icon-btn info" data-info="'+s.id+'">♫</button><button class="icon-btn remove" data-remove="'+s.id+'">×</button></td></tr>'}).join('')}
function readTags(song){if(!song.file.name.toLowerCase().endsWith('.mp3'))return;song.file.slice(0,Math.min(song.file.size,8*1024*1024)).arrayBuffer().then(buf=>{const b=new Uint8Array(buf);if(String.fromCharCode(...b.slice(0,3))!=='ID3')return;let p=10;const end=Math.min(b.length,10+((b[6]<<21)|(b[7]<<14)|(b[8]<<7)|b[9]));while(p+10<end){const id=String.fromCharCode(...b.slice(p,p+4)),n=(b[p+4]<<24)|(b[p+5]<<16)|(b[p+6]<<8)|b[p+7];if(!id.trim()||n<=0||p+10+n>end)break;const d=b.slice(p+10,p+10+n);if(id==='APIC'){let q=1;while(q<d.length&&d[q]!==0)q++;q+=2;while(q<d.length&&d[q]!==0)q++;q++;if(q<d.length)song.coverUrl=URL.createObjectURL(new Blob([d.slice(q)]))}else if(id==='USLT'){song.lyrics=decodeTagText(d.slice(4))}else if(id==='TIT2'||id==='TPE1'||id==='TALB'){const t=decodeTagText(d);if(t){if(id==='TIT2')song.title=t;if(id==='TPE1')song.artist=t;if(id==='TALB')song.album=t}}p+=10+n}render()}).catch(()=>{})}
function decodeTagText(d){if(!d||d.length<2)return'';try{const enc=d[0];let t;if(enc===0)t=new TextDecoder('windows-1252').decode(d.slice(1));else if(enc===3)t=new TextDecoder('utf-8').decode(d.slice(1));else t=new TextDecoder(enc===1?'utf-16':'utf-16be').decode(d.slice(1));return t.replace(/\0/g,'').trim()}catch{return''}}
function showDetails(id){const s=songs.find(x=>x.id===id);if(!s)return;$('detailTitle').textContent=s.title;$('detailArtist').textContent=s.artist+' · '+s.album+' · '+fmtSize(s.file.size);$('detailCover').src=s.coverUrl||'';$('detailCover').style.display=s.coverUrl?'block':'none';$('lyricsText').textContent=s.lyrics||'没有读取到内嵌歌词。当前支持显示已读取的歌曲标签歌词与封面。';$('detailPanel').classList.add('open')}
async function scanDuplicates(){const b=$('dedupeBtn');b.disabled=true;b.textContent='扫描中…';const seen=new Map(),dups=[];for(const s of songs){try{const h=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',await s.file.arrayBuffer()))).map(x=>x.toString(16).padStart(2,'0')).join('');if(seen.has(h))dups.push(s);else seen.set(h,s)}catch{}}if(dups.length&&confirm('发现 '+dups.length+' 个内容完全相同的重复文件。删除列表中的重复项？不会删除电脑上的原始文件。')){const ids=new Set(dups.map(x=>x.id));songs=songs.filter(x=>!ids.has(x.id));render()}else if(!dups.length)alert('没有发现完全相同的重复歌曲。');b.disabled=false;b.textContent='检查重复歌曲'}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function playIndex(i){if(!songs.length)return;i=(i+songs.length)%songs.length;current=i;let s=songs[i];if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(s.file);audio.src=objectUrl;audio.play().catch(()=>{});s.played=Date.now();$('nowTitle').textContent=s.title;$('nowArtist').textContent=s.artist;$('nowCover').style.backgroundImage=s.coverUrl?'url("'+s.coverUrl+'")':'';$('nowCover').textContent=s.coverUrl?'':'♫';$('play').textContent='Ⅱ';$('nowFav').textContent=s.fav?'♥':'♡';render()}
function toggle(){if(current<0){let a=visible();if(a.length)playIndex(songs.indexOf(a[0]));return}if(audio.paused){audio.play();$('play').textContent='Ⅱ'}else{audio.pause();$('play').textContent='▶'}}
function step(dir){if(!songs.length)return;let i;if(shuffle)i=Math.floor(Math.random()*songs.length);else i=(current+dir+songs.length)%songs.length;playIndex(i)}
$('dedupeBtn').onclick=scanDuplicates;$('closeDetail').onclick=()=>$('detailPanel').classList.remove('open');$('detailPanel').onclick=e=>{if(e.target===$('detailPanel'))$('detailPanel').classList.remove('open')};$('fileBtn').onclick=$('addSide').onclick=()=>$('files').click();$('folderBtn').onclick=()=>$('folders').click();$('files').onchange=e=>addFiles(e.target.files);$('folders').onchange=e=>addFiles(e.target.files);
$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('over')};$('drop').ondragleave=()=>$('drop').classList.remove('over');$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('over');addFiles(e.dataTransfer.files)};
$('search').oninput=render;$('tracks').onclick=e=>{let f=e.target.closest('[data-fav]'),r=e.target.closest('[data-remove]'),tr=e.target.closest('tr[data-id]');let info=e.target.closest('[data-info]');if(info){showDetails(info.dataset.info);return}if(f){let s=songs.find(x=>x.id===f.dataset.fav);s.fav=!s.fav;render();$('nowFav').textContent=current>=0&&songs[current].fav?'♥':'♡'}else if(r){let id=r.dataset.remove,i=songs.findIndex(x=>x.id===id);songs.splice(i,1);if(i===current){audio.pause();current=-1;$('nowTitle').textContent='尚未播放';$('play').textContent='▶'}else if(i<current)current--;render()}else if(tr)playIndex(songs.findIndex(x=>x.id===tr.dataset.id))};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));$('pageTitle').textContent=({all:'全部歌曲',favorites:'我的收藏',recent:'最近播放'})[view];render()});
document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{sort=b.dataset.sort;document.querySelectorAll('[data-sort]').forEach(x=>x.classList.toggle('active',x===b));render()});
$('play').onclick=toggle;$('heroPlay').onclick=()=>{let a=visible();if(a.length)playIndex(songs.indexOf(a[0]))};$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('shuffle').onclick=()=>{shuffle=!shuffle;$('shuffle').style.color=shuffle?'#c5aaff':''};$('repeat').onclick=()=>{repeat=!repeat;$('repeat').style.color=repeat?'#c5aaff':''};$('nowFav').onclick=()=>{if(current>=0){songs[current].fav=!songs[current].fav;$('nowFav').textContent=songs[current].fav?'♥':'♡';render()}};
$('volume').oninput=e=>audio.volume=Number(e.target.value);$('mute').onclick=()=>{audio.muted=!audio.muted;$('mute').textContent=audio.muted?'×':'◖))'};$('seek').oninput=e=>{if(audio.duration)audio.currentTime=Number(e.target.value)/1000*audio.duration};
audio.ontimeupdate=()=>{if(audio.duration){$('seek').value=audio.currentTime/audio.duration*1000;$('elapsed').textContent=fmt(audio.currentTime);$('duration').textContent=fmt(audio.duration)}};audio.onloadedmetadata=()=>{if(current>=0){songs[current].duration=audio.duration;render()}};audio.onended=()=>{if(repeat)playIndex(current);else step(1)};audio.volume=.8;
})();
</script></body></html>
